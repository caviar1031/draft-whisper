[package]
name = "draft-whisper"
version = "0.1.3"
description = "AI 配音桌面工具 - 一句一句管理你的配音"
authors = ["caviar1031"]
license = "MIT"
repository = "https://github.com/caviar1031/draft-whisper"
homepage = "https://github.com/caviar1031/draft-whisper"
readme = "../README.md"
keywords = ["tauri", "tts", "voice-over", "macos"]
categories = ["gui", "multimedia"]
publish = false
edition = "2021"
rust-version = "1.99.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "draft_whisper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
log = "0.4.35"
tauri = { version = "2.12.5", features = ["macos-private-api"] }
tauri-plugin-log = "2.10.1"
tauri-plugin-dialog = "2.8.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
base64 = "0.23.1"
tauri-plugin-opener = "2.7.2"
# Windows API Key 安全存储 — 使用系统 Credential Manager
[target.'cfg(target_os = "windows")'.dependencies]
keyring-core = "1.0.1"
windows-native-keyring-store = { version = "1.1.0", default-features = false }
# Keep the COM macro support crate aligned with the Windows bindings.
windows-core = "0.100.0"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
] }

# macOS 原生文件拖拽 — 用于将音频文件拖入剪映/Premiere 等剪辑软件
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
# macOS 动态毛玻璃 (Vibrancy) — Tauri 2 直接在 setup 中应用
window-vibrancy = "0.8.1"
