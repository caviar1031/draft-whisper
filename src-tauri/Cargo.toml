[package]
name = "draft-whisper"
version = "0.1.2"
description = "AI 配音桌面工具 - 一句一句管理你的配音"
authors = ["caviar1031"]
license = "MIT"
repository = "https://github.com/caviar1031/draft-whisper"
homepage = "https://github.com/caviar1031/draft-whisper"
readme = "../README.md"
keywords = ["tauri", "tts", "voice-over", "macos"]
categories = ["gui", "multimedia"]
publish = false
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "draft_whisper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
tauri-plugin-opener = "2"
# Windows API Key 安全存储 — 使用系统 Credential Manager
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
] }
windows-core = "0.61.2"

# macOS 原生文件拖拽 — 用于将音频文件拖入剪映/Premiere 等剪辑软件
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
# macOS 动态毛玻璃 (Vibrancy) — Tauri 2 直接在 setup 中应用
window-vibrancy = "0.5"
